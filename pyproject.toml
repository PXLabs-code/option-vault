[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "option-vault"
version = "0.1.0"
description = "Local delayed US option snapshots with Telegram reporting"
requires-python = ">=3.9"
dependencies = [
  "requests>=2.31",
  "yfinance>=0.2.65",
  "pandas-market-calendars>=4.4,<5; python_version < '3.10'",
  "pandas-market-calendars>=5; python_version >= '3.10'",
  "flask>=3.0,<4",
  "waitress>=3.0,<4",
  "plotly>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
option-vault = "option_vault.cli:main"
option-vault-web = "option_vault.web:main"
option-vault-history = "option_vault.research_history:main"

[tool.setuptools.package-data]
option_vault = ["templates/*.html", "static/*.js", "static/*.css"]

[tool.setuptools.packages.find]
include = ["option_vault*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 100
