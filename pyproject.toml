[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "option-vault"
version = "0.1.0"
description = "Local delayed US option snapshots with Telegram reporting"
requires-python = ">=3.9"
dependencies = [
  "requests>=2.31",
  "yfinance>=0.2.65",
  "pandas-market-calendars>=4.4,<5; python_version < '3.10'",
  "pandas-market-calendars>=5; python_version >= '3.10'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
option-vault = "option_vault.cli:main"

[tool.setuptools.packages.find]
include = ["option_vault*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 100
